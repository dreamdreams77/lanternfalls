<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="description" content="Lanternfall - a retro-inspired metroidvania about a small flame in a large dark. Playable in your browser.">
<title>Lanternfall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lanternfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0a1a'/%3E%3Crect x='6' y='3' width='4' height='10' fill='%23ff8a3d'/%3E%3Crect x='7' y='2' width='2' height='8' fill='%23ffd27a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="ui"></div>
  <div id="touch" class="hidden">
    <div class="tgrp tleft">
      <button class="tbtn" data-k="left" aria-label="Left">&#9664;</button>
      <button class="tbtn" data-k="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="tgrp tright">
      <button class="tbtn small" data-k="flare" aria-label="Flare">FLARE</button>
      <button class="tbtn small" data-k="dash" aria-label="Dash">DASH</button>
      <button class="tbtn small" data-k="shoot" aria-label="Shoot">SHOT</button>
      <button class="tbtn small" data-k="up" aria-label="Interact">ACT</button>
      <button class="tbtn" data-k="attack" aria-label="Attack">HIT</button>
      <button class="tbtn big" data-k="jump" aria-label="Jump">JUMP</button>
    </div>
    <div class="ttop">
      <button class="tbtn tiny" data-k="down" aria-label="Down">&#9660;</button>
      <button class="tbtn tiny" data-k="map" aria-label="Map">MAP</button>
      <button class="tbtn tiny" data-k="pause" aria-label="Pause">II</button>
    </div>
  </div>
  <div id="loading">LANTERNFALL<br><small>kindling...</small></div>
</div>
<noscript>Lanternfall needs JavaScript enabled.</noscript>
<script src="js/util.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/sprites.js"></script>
<script src="js/levels.js"></script>
<script src="js/levels2.js"></script>
<script src="js/entities.js"></script>
<script src="js/bosses.js"></script>
<script src="js/game.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/depth.js"></script>
<script src="js/polish.js"></script>
<script src="js/fx2.js"></script>
<script src="js/fx3.js"></script>
<script src="js/fx.js"></script>
<script src="js/depth2.js"></script>
<script src="js/seasons.js"></script>
<script src="js/depth3.js"></script>
<script src="js/depth4.js"></script>
<script src="js/shot.js"></script>
<script src="js/arcade.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
