<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="description" content="Lanternfall - a retro-inspired metroidvania about a small flame in a large dark. Playable in your browser.">
<title>Lanternfall</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lanternfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0a1a'/%3E%3Crect x='6' y='3' width='4' height='10' fill='%23ff8a3d'/%3E%3Crect x='7' y='2' width='2' height='8' fill='%23ffd27a'/%3E%3C/svg%3E">
<style>
:root{
  --u:12px; /* set from JS: stage height / 30 */
  --ink:#0b0a1a; --panel:#17132e; --panel2:#241c46; --line:#5a4a9c;
  --amber:#ffc15a; --amber2:#ff8a3d; --text:#f3e9ff; --dim:#a597d4; --good:#7dffb0; --bad:#ff6f7d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#050410;overflow:hidden;color:var(--text);
  font-family:"Trebuchet MS","Verdana",system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;transform:translate(-50%,-50%);
  background:#000;overflow:hidden;box-shadow:0 0 0 2px #2a1f55,0 0 60px #3a1f7a55}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0;font-size:calc(var(--u)*0.95);pointer-events:none}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
#loading{position:absolute;inset:0;background:#0b0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--amber);font-size:calc(var(--u)*2);letter-spacing:.3em;text-align:center;z-index:99}
#loading small{font-size:calc(var(--u)*.9);color:var(--dim);letter-spacing:.2em}

/* generic screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:fadein .35s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dim{background:radial-gradient(ellipse at center,#120d2acc 0%,#05040fe6 100%)}
.panel{background:linear-gradient(#1c1638,#120e28);border:calc(var(--u)*.18) solid var(--line);
  box-shadow:0 0 0 calc(var(--u)*.18) #0b0a1a,0 0 calc(var(--u)*2) #6a3fd055,inset 0 0 calc(var(--u)*1.2) #00000088;
  padding:calc(var(--u)*1.2) calc(var(--u)*1.6);max-width:92%;max-height:92%;overflow:auto}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
h2{color:var(--amber);font-size:calc(var(--u)*1.5);text-align:center;margin-bottom:calc(var(--u)*.8);text-shadow:0 0 calc(var(--u)*.8) #ff9a3c88}
h3{color:var(--dim);font-size:calc(var(--u)*.95);margin:calc(var(--u)*.7) 0 calc(var(--u)*.3)}

/* title */
#title{justify-content:flex-end;padding-bottom:calc(var(--u)*2.2);background:linear-gradient(#0000 40%,#05040fd0)}
.logo{font-size:calc(var(--u)*4.6);color:#ffe2a0;letter-spacing:.14em;text-align:center;line-height:1;margin-bottom:calc(var(--u)*.3);
  text-shadow:0 calc(var(--u)*.2) 0 #c4561f,0 calc(var(--u)*.4) 0 #7a2a12,0 0 calc(var(--u)*1.8) #ffa23c,0 0 calc(var(--u)*4) #ff6a2a88;
  animation:flick 3.2s infinite}
@keyframes flick{0%,100%{filter:brightness(1)}47%{filter:brightness(1)}50%{filter:brightness(.82)}53%{filter:brightness(1.1)}}
.sub{color:var(--dim);letter-spacing:.35em;font-size:calc(var(--u)*.8);margin-bottom:calc(var(--u)*1.4);text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:calc(var(--u)*.55);align-items:stretch;min-width:calc(var(--u)*13)}
.btn{font:inherit;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text);background:#241c46;
  border:calc(var(--u)*.16) solid var(--line);padding:calc(var(--u)*.55) calc(var(--u)*1.4);cursor:pointer;
  box-shadow:0 calc(var(--u)*.22) 0 #0b0a1a;text-align:center;font-size:calc(var(--u)*1)}
.btn:hover,.btn:focus-visible,.btn.sel{background:#3a2c78;border-color:var(--amber);color:#fff2c9;outline:none;transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.dis{opacity:.4;pointer-events:none}
.btn.danger{border-color:#a0384a}.btn.danger:hover{background:#5a1c2c;border-color:var(--bad)}
.btn.sm{padding:calc(var(--u)*.3) calc(var(--u)*.8);font-size:calc(var(--u)*.8)}
.hint{color:var(--dim);font-size:calc(var(--u)*.72);letter-spacing:.1em;text-align:center;margin-top:calc(var(--u)*.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1);margin:calc(var(--u)*.45) 0}
.row label{letter-spacing:.1em;font-size:calc(var(--u)*.9)}
input[type=range]{-webkit-appearance:none;appearance:none;width:calc(var(--u)*9);height:calc(var(--u)*.7);background:#0b0a1a;border:2px solid var(--line);outline:none;touch-action:auto}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*.9);height:calc(var(--u)*1.3);background:var(--amber);border:2px solid #7a2a12;cursor:pointer}
input[type=range]::-moz-range-thumb{width:calc(var(--u)*.9);height:calc(var(--u)*1.3);background:var(--amber);border:2px solid #7a2a12;border-radius:0;cursor:pointer}
.tog{min-width:calc(var(--u)*4.5)}

/* tabs / inventory */
.tabs{display:flex;gap:calc(var(--u)*.4);justify-content:center;margin-bottom:calc(var(--u)*.8);flex-wrap:wrap}
.cols{display:flex;gap:calc(var(--u)*1.4);align-items:flex-start;flex-wrap:wrap;justify-content:center}
.col{min-width:calc(var(--u)*12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*5.4),1fr));gap:calc(var(--u)*.45)}
.card{background:#0f0b22;border:2px solid #3b2d78;padding:calc(var(--u)*.45);display:flex;gap:calc(var(--u)*.5);align-items:center;cursor:pointer}
.card.eq{border-color:var(--amber);background:#2a1d10}
.card.locked{opacity:.35;cursor:default}
.card .ic{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);flex:none;image-rendering:pixelated}
.card b{font-size:calc(var(--u)*.8);display:block;letter-spacing:.06em}
.card span{font-size:calc(var(--u)*.68);color:var(--dim);line-height:1.2;display:block}
.stat{display:flex;justify-content:space-between;gap:calc(var(--u)*1.5);font-size:calc(var(--u)*.85);padding:calc(var(--u)*.15) 0;border-bottom:1px dashed #3b2d78}
.stat b{color:var(--amber)}
.entry{padding:calc(var(--u)*.4) 0;border-bottom:1px dashed #3b2d78;font-size:calc(var(--u)*.82);line-height:1.35}
.entry b{color:var(--amber);letter-spacing:.08em}
.entry.unk{color:#5a4a9c}
#mapcv{width:calc(var(--u)*34);max-width:100%;image-rendering:pixelated;background:#07050f;border:2px solid var(--line)}

/* dialog */
#dialog{position:absolute;left:4%;right:4%;bottom:5%;display:flex;gap:calc(var(--u)*.8);align-items:flex-start;animation:fadein .2s both}
#dialog .who{color:var(--amber);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u)*.85);margin-bottom:calc(var(--u)*.25)}
#dialog .txt{font-size:calc(var(--u)*1);line-height:1.4;min-height:calc(var(--u)*2.8)}
#dialog .nx{position:absolute;right:calc(var(--u)*.8);bottom:calc(var(--u)*.3);color:var(--amber);animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dialog .panel{flex:1;position:relative}
#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:calc(var(--u)*.3);align-items:center;pointer-events:none!important}
.toast{background:#150f2ccc;border:2px solid var(--amber);padding:calc(var(--u)*.3) calc(var(--u)*1);color:#fff2c9;letter-spacing:.1em;
  font-size:calc(var(--u)*.85);animation:toast 2.6s both;text-shadow:0 0 8px #ff9a3c}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
#banner{position:absolute;left:0;right:0;top:18%;text-align:center;pointer-events:none!important;animation:banner 3.4s both;
  color:#ffe2a0;font-size:calc(var(--u)*1.7);letter-spacing:.32em;text-transform:uppercase;text-shadow:0 0 calc(var(--u)*1) #ff8a3d,0 2px 0 #000}
#banner small{display:block;font-size:calc(var(--u)*.75);color:var(--dim);letter-spacing:.4em;margin-top:.4em}
@keyframes banner{0%{opacity:0;letter-spacing:.6em}20%,75%{opacity:1;letter-spacing:.32em}100%{opacity:0}}
#tip{position:absolute;left:50%;top:34%;transform:translateX(-50%);background:#0b0a1acc;border:2px solid var(--line);padding:calc(var(--u)*.3) calc(var(--u)*.9);
  font-size:calc(var(--u)*.8);letter-spacing:.08em;pointer-events:none!important;color:var(--amber);white-space:nowrap}
#confirm{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
#confirm .panel{text-align:center;max-width:calc(var(--u)*22)}
#confirm p{margin:.5em 0 1em;line-height:1.4}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none!important;transition:opacity .3s}
.credits{white-space:pre-line;text-align:center;line-height:1.6;color:var(--text);font-size:calc(var(--u)*.9)}

/* touch controls */
#touch{position:absolute;inset:0;pointer-events:none;z-index:20}
#touch .tgrp{position:absolute;bottom:calc(var(--u)*.8);display:flex;gap:calc(var(--u)*.7);align-items:flex-end;pointer-events:none}
.tleft{left:calc(var(--u)*.8)}.tright{right:calc(var(--u)*.8);flex-wrap:wrap;justify-content:flex-end;width:calc(var(--u)*13)}
.tbtn{pointer-events:auto;font:inherit;font-weight:900;color:#fff;background:#2a1f5acc;border:2px solid #8a6af0;border-radius:50%;
  width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);font-size:calc(var(--u)*.8);letter-spacing:.05em;opacity:.78;padding:0}
.tbtn.big{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6)}
.tbtn.small{width:calc(var(--u)*3);height:calc(var(--u)*3);font-size:calc(var(--u)*.65)}
.tbtn.tiny{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);font-size:calc(var(--u)*.6)}
.tbtn.on{background:#ffb23acc;color:#2a1000;opacity:1}
.ttop{position:absolute;top:calc(var(--u)*.5);right:calc(var(--u)*.5);display:flex;gap:calc(var(--u)*.4);pointer-events:none}
@media (max-width:700px){.logo{letter-spacing:.06em}}

/* interactive layers inside the UI container */
.screen,#dialog,#confirm{pointer-events:auto}
#tip{pointer-events:none}

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="ui"></div>
  <div id="touch" class="hidden">
    <div class="tgrp tleft">
      <button class="tbtn" data-k="left" aria-label="Left">&#9664;</button>
      <button class="tbtn" data-k="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="tgrp tright">
      <button class="tbtn small" data-k="flare" aria-label="Flare">FLARE</button>
      <button class="tbtn small" data-k="dash" aria-label="Dash">DASH</button>
      <button class="tbtn small" data-k="up" aria-label="Interact">ACT</button>
      <button class="tbtn" data-k="attack" aria-label="Attack">HIT</button>
      <button class="tbtn big" data-k="jump" aria-label="Jump">JUMP</button>
    </div>
    <div class="ttop">
      <button class="tbtn tiny" data-k="down" aria-label="Down">&#9660;</button>
      <button class="tbtn tiny" data-k="map" aria-label="Map">MAP</button>
      <button class="tbtn tiny" data-k="pause" aria-label="Pause">II</button>
    </div>
  </div>
  <div id="loading">LANTERNFALL<br><small>kindling...</small></div>
</div>
<noscript>Lanternfall needs JavaScript enabled.</noscript>
<script>
/* Lanternfall - core utilities: namespace, math, RNG, input */
(function () {
  'use strict';
  const LF = window.LF = window.LF || {};
  LF.W = 320; LF.H = 180; LF.T = 16;

  LF.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  LF.lerp = (a, b, t) => a + (b - a) * t;
  LF.rand = (a, b) => a + Math.random() * (b - a);
  LF.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  LF.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  LF.approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
  LF.sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
  LF.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  LF.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // Seeded RNG (mulberry32) for stable procedural art
  LF.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  LF.hash = function (x, y, s) {
    let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };

  // Tiny event bus
  LF.bus = {
    h: {},
    on(n, f) { (this.h[n] = this.h[n] || []).push(f); },
    emit(n, a) { (this.h[n] || []).forEach(f => f(a)); }
  };

  /* ---------------- Input ---------------- */
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', KeyE: 'up', ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
    KeyX: 'attack', KeyJ: 'attack', Enter: 'attack',
    KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyV: 'flare', KeyF: 'flare', KeyQ: 'flare', Escape: 'pause', KeyP: 'pause', KeyM: 'map', Tab: 'inv', KeyI: 'inv'
  };
  const In = LF.input = {
    down: {}, pressed: {}, released: {}, buf: {}, locked: false, lastDevice: 'kb',
    isDown(a) { return !!this.down[a]; },
    hit(a) { return !!this.pressed[a]; },
    set(a, v, dev) {
      if (v) { if (!this.down[a]) this.pressed[a] = true; this.down[a] = true; }
      else { if (this.down[a]) this.released[a] = true; this.down[a] = false; }
      if (dev) this.lastDevice = dev;
    },
    endFrame() { this.pressed = {}; this.released = {}; },
    clear() { this.down = {}; this.pressed = {}; this.released = {}; },
    get axis() { return (this.down.right ? 1 : 0) - (this.down.left ? 1 : 0); }
  };
  window.addEventListener('keydown', e => {
    const a = KEYMAP[e.code];
    if (!a) return;
    if (e.code === 'Tab' || e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    if (e.repeat) return;
    In.set(a, true, 'kb');
    LF.bus.emit('key', { action: a, code: e.code });
  });
  window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) In.set(a, false); });
  window.addEventListener('blur', () => In.clear());

  // Touch / pointer buttons
  LF.initTouch = function () {
    const root = document.getElementById('touch');
    const active = new Map();
    root.querySelectorAll('.tbtn').forEach(b => {
      const k = b.dataset.k;
      const press = e => {
        e.preventDefault(); In.set(k, true, 'touch'); b.classList.add('on'); active.set(e.pointerId, b);
        try { b.setPointerCapture(e.pointerId); } catch (_) {}
        LF.bus.emit('key', { action: k, code: 'touch' });
      };
      const rel = e => { In.set(k, false); b.classList.remove('on'); active.delete(e.pointerId); };
      b.addEventListener('pointerdown', press);
      b.addEventListener('pointerup', rel);
      b.addEventListener('pointercancel', rel);
      b.addEventListener('lostpointercapture', rel);
    });
    const show = () => root.classList.toggle('hidden', !LF.touchOn());
    LF.refreshTouch = show;
    window.addEventListener('touchstart', () => {
      if (!LF.touchDetected) { LF.touchDetected = true; show(); } In.lastDevice = 'touch';
    }, { passive: true });
    show();
  };
  LF.touchOn = () => {
    const s = LF.settings;
    if (s && s.touch === 'on') return LF.state === 'play' || LF.state === 'paused';
    if (s && s.touch === 'off') return false;
    return !!LF.touchDetected && (LF.state === 'play');
  };

  // Gamepad (optional, standard mapping)
  const padPrev = {};
  LF.pollPad = function () {
    if (LF.padBlocked) return;
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (_) { LF.padBlocked = true; return; }
    const p = pads && pads[0];
    if (!p) return;
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const m = {
      left: ax < -0.4 || b(14), right: ax > 0.4 || b(15), up: ay < -0.6 || b(12), down: ay > 0.6 || b(13),
      jump: b(0), attack: b(2) || b(1), dash: b(5) || b(7) || b(3), flare: b(4) || b(6), pause: b(9), map: b(8)
    };
    for (const k in m) {
      if (m[k] !== !!padPrev[k]) { In.set(k, m[k], 'pad'); if (m[k]) LF.bus.emit('key', { action: k, code: 'pad' }); }
      padPrev[k] = m[k];
    }
  };
})();

</script>
<script>
/* Lanternfall - settings and save data (localStorage with in-memory fallback) */
(function () {
  'use strict';
  const LF = window.LF;
  const SAVE_KEY = 'lanternfall.save.v1', SET_KEY = 'lanternfall.settings.v1';
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (_) { delete mem[k]; } }
  };

  LF.defaultSettings = () => ({ music: 0.6, sfx: 0.8, amb: 0.7, mute: false, shake: true, touch: 'auto', reduce: false });
  LF.loadSettings = function () {
    let s = LF.defaultSettings();
    try { const r = JSON.parse(store.get(SET_KEY) || 'null'); if (r) s = Object.assign(s, r); } catch (_) {}
    LF.settings = s; return s;
  };
  LF.saveSettings = function () { store.set(SET_KEY, JSON.stringify(LF.settings)); };

  LF.newSave = function () {
    return {
      v: 1, hp: 5, maxHp: 5, embers: 0,
      abil: { dbl: false, dash: false, glide: false },
      charms: [], eq: [], slots: 2, dmgLvl: 0, lightLvl: 0, flaskLvl: 0,
      flags: {}, sigils: { root: false, prism: false, tide: false },
      moths: [], lore: [], bestiary: {}, ext: { elites: 0, parries: 0, flares: 0, chain: 0, finish: 0, guard: 0, night: 0 }, up: { fcost: 0, fgain: 0 }, bounties: {}, seen: {}, cp: { room: 'glade', x: 5, y: 9 },
      time: 0, deaths: 0, ng: 0, lost: null, gaunt: 0, ending: false, kills: 0, created: Date.now(), saved: 0
    };
  };

  LF.Save = {
    exists() { return !!store.get(SAVE_KEY); },
    load() {
      try {
        const r = JSON.parse(store.get(SAVE_KEY) || 'null');
        if (!r || r.v !== 1) return null;
        return Object.assign(LF.newSave(), r);
      } catch (e) { console.warn('save load failed', e); return null; }
    },
    write(d) {
      try { d.saved = Date.now(); store.set(SAVE_KEY, JSON.stringify(d)); return true; }
      catch (e) { console.warn('save failed', e); return false; }
    },
    remove() { store.del(SAVE_KEY); },
    summary() {
      const d = this.load(); if (!d) return null;
      return { time: d.time, room: d.cp.room, hp: d.maxHp, ng: d.ng, pct: LF.completion ? LF.completion(d) : 0 };
    }
  };

  LF.fmtTime = function (s) {
    s = Math.floor(s || 0);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(ss).padStart(2, '0');
  };
})();

</script>
<script>
/* Lanternfall - procedural chiptune music, ambience and sound effects (WebAudio, no assets) */
(function () {
  'use strict';
  const LF = window.LF;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ---- track definitions: generated procedurally with a seeded RNG so each area has a stable theme ---- */

    { id: 'chain', name: 'Chain Master', desc: 'Reach a x5 kill chain.', test: s => [s.ext.chain, 5], reward: 'embers:120', rtxt: '120 embers' },

    { id: 'night', name: 'Night Watch', desc: 'Defeat 5 night wisps in Mossroot.', test: s => [s.ext.night, 5], reward: 'embers:100', rtxt: '100 embers' },
    { id: 'flare', name: 'Flare Dancer', desc: 'Unleash Flare 10 times.', test: s => [s.ext.flares, 10], reward: 'slot', rtxt: '+1 charm slot' },
    { id: 'finish', name: 'Finisher', desc: 'Land 15 finishing blows (every third hit).', test: s => [s.ext.finish, 15], reward: 'embers:150', rtxt: '150 embers' },

             rock: ['#2d2236', '#3b2c44', '#4c3a56', '#1d1526'], top: ['#3f8a4c', '#68c262', '#a6e684'], deep: '#120c1c', glow: '#ffd27a', fog: '#8a6ab8', dark: .36 },
    glim:  { name: 'Glimmer Deep', sky: ['#07061a', '#0d0c33', '#17135a', '#241a78'], far: '#1a1650', mid: '#120f3c', near: '#0a0824',
             rock: ['#1f1c42', '#2b2760', '#3a3480', '#14122e'], top: ['#4a7bd8', '#7ad8ff', '#d4f4ff'], deep: '#0a0820', glow: '#7ad8ff', fog: '#5a4ad0', dark: .62 },
    drown: { name: 'Drowned Chapel', sky: ['#04161c', '#0a2e36', '#12505a', '#2a8286'], far: '#0e3d46', mid: '#0a2c34', near: '#051a20',
             rock: ['#1b3840', '#264b55', '#34626c', '#10242b'], top: ['#2f8f86', '#4fc7b4', '#9af0d8'], deep: '#071419', glow: '#9af0d8', fog: '#3aa0a0', dark: .55 },
    spire: { name: 'Ember Spire', sky: ['#14060e', '#3a0f24', '#8a2a24', '#e0742a'], far: '#4a1630', mid: '#33101f', near: '#1c0812',
             rock: ['#3a2230', '#4e2f40', '#66404e', '#24121c'], top: ['#b84a22', '#ff8a3d', '#ffd27a'], deep: '#160810', glow: '#ff9a3c', fog: '#a03a3a', dark: .5 }

        for (let i = 0; i < T; i += 2) { const k = h(tx * 16 + i, ty, 5); if (k < .5) R(c, P.top[2], x0 + i, y0, 1, 1); if (k > .55) R(c, P.top[0], x0 + i, y0 + 3, 1, 1 + (k > .8 ? 2 : 0)); }

  /* ---------- bake a room's static layer + generate animated decor ---------- */
  LF.Art = {
    bakeRoom(room) {

        else if (ch === '=') {

            const wd = Math.max(1, 4 - Math.floor(r / 2.2)), yy = up ? y0 + T - 1 - r : y0 + r;
            R(g, room.area === 'glim' ? '#8fb8ff' : room.area === 'snow' ? '#d8f0ff' : room.area === 'storm' ? '#9ab0d0' : room.area === 'spire' ? '#ff7a3a' : '#c9d8a0', x0 + i * 4 + (4 - wd) / 2 | 0, yy, wd, 1);
            R(g, room.area === 'glim' ? '#3a56b8' : room.area === 'snow' ? '#6a8cc4' : room.area === 'storm' ? '#3a4a6a' : room.area === 'spire' ? '#8a2a18' : '#5a6a3a', x0 + i * 4 + 3, yy, 1, 1);
          }

      }

      room.decor = this.makeDecor(room, at, air);
    },
    makeDecor(room, at, air) {
      const d = [], w = room.w, h = room.h, a = room.area, hs = LF.hash;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (at(x, y) !== '#') continue;
        const k = hs(x, y, 31), k2 = hs(x, y, 77);
        if (air(x, y - 1) && at(x, y - 1) !== '^') { // surface decor
          if (a === 'moss') { if (k < .6) d.push({ t: 'grass', x: x * T + k2 * 12, y: y * T, s: k, h: 4 + k * 6 }); if (k > .9) d.push({ t: 'shroom', x: x * T + 8, y: y * T, s: k2, l: 34 }); if (k > .82 && k < .87) d.push({ t: 'flower', x: x * T + 5 + k2 * 6, y: y * T, s: k2 }); }
          if (a === 'glim') { if (k > .78) d.push({ t: 'crystal', x: x * T + 4 + k2 * 8, y: y * T, s: k2, l: 40 }); if (k < .12) d.push({ t: 'shroom', x: x * T + 8, y: y * T, s: k2, l: 30, blue: 1 }); }
          if (a === 'drown') { if (k < .35) d.push({ t: 'reed', x: x * T + k2 * 12, y: y * T, s: k, h: 5 + k * 8 }); if (k > .93) d.push({ t: 'candle', x: x * T + 8, y: y * T, s: k2, l: 46 }); if (k > .85 && k < .9) d.push({ t: 'bones', x: x * T + 6, y: y * T, s: k2 }); }

    },
    /* ---------- decor drawing (animated) ---------- */
    drawDecor(g, room, cam, t, lights) {
      const P = PAL[room.area], x0 = cam.x - 24, x1 = cam.x + LF.W + 24, y0 = cam.y - 24, y1 = cam.y + LF.H + 24;
      for (const o of room.decor) {
        if (o.x < x0 || o.x > x1 || o.y < y0 || o.y > y1 + 30) continue;
        const x = o.x - cam.x | 0, y = o.y - cam.y | 0, sw = Math.sin(t * 1.6 + o.s * 20);
        switch (o.t) {
          case 'grass': for (let i = 0; i < 3; i++) { R(g, i === 1 ? P.top[2] : P.top[1], x + i * 2 + Math.round(sw * (o.h / 6)), y - o.h + i * 2, 1, o.h - i * 2); R(g, P.top[0], x + i * 2, y - 2, 1, 2); } break;
          case 'reed': R(g, P.top[0], x, y - o.h, 1, o.h); R(g, P.top[1], x + Math.round(sw), y - o.h - 1, 1, 2); R(g, P.top[0], x + 2, y - o.h * .6, 1, o.h * .6); break;

          case 'shroom': { const col = o.blue ? ['#4a8aff', '#bfe4ff'] : ['#e07a5a', '#ffd9a0']; R(g, '#e8dcc8', x - 1, y - 4, 2, 4); R(g, col[0], x - 3, y - 7, 7, 3); R(g, col[1], x - 2, y - 7, 2, 1); R(g, col[1], x + 1, y - 6, 1, 1); lights.push({ x: o.x, y: o.y - 5, r: o.l, c: col[0], a: .7 + .15 * sw }); break; }

          case 'vent': { R(g, '#2a1018', x - 4, y - 3, 9, 3); R(g, '#ff8a3d', x - 2, y - 3, 5, 1); const f = (t * 2 + o.s * 5) % 1; R(g, '#ffd27a', x - 1 + Math.sin(t * 5 + o.s * 9) * 2, y - 4 - f * 16, 2, 2); lights.push({ x: o.x, y: o.y - 4, r: o.l, c: '#ff8a3d', a: .6 + .25 * Math.sin(t * 6 + o.s * 9) }); break; }

<script>

<script>
/* Lanternfall - physics, player controller, enemies, projectiles */
(function () {
  'use strict';
  const LF = window.LF, T = LF.T, In = LF.input, cl = LF.clamp;

  /* ============================== PHYSICS ============================== */
  const SOLID = '#SDgG';
  const Phys = LF.Phys = {
    solid(ch) { return SOLID.indexOf(ch) >= 0; },
    move(b, dt, G, o) {
      o = o || {};
      b.hitX = 0; b.hitHead = false;
      // --- X ---
      b.x += b.vx * dt;
      let tx0 = Math.floor(b.x / T), tx1 = Math.floor((b.x + b.w - .001) / T), ty0 = Math.floor(b.y / T), ty1 = Math.floor((b.y + b.h - .001) / T);
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
        if (this.solid(G.tile(tx, ty))) {
          if (b.vx > 0 || (b.vx === 0 && b.x + b.w / 2 < tx * T + T / 2)) { b.x = tx * T - b.w; b.hitX = 1; } else { b.x = (tx + 1) * T; b.hitX = -1; }
          b.vx = 0; tx0 = Math.floor(b.x / T); tx1 = Math.floor((b.x + b.w - .001) / T);
        }
      }
      // --- Y ---
      const prevBottom = b.y + b.h;
      b.y += b.vy * dt; b.onGround = false;
      tx0 = Math.floor(b.x / T); tx1 = Math.floor((b.x + b.w - .001) / T); ty0 = Math.floor(b.y / T); ty1 = Math.floor((b.y + b.h - .001) / T);
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
        const ch = G.tile(tx, ty);
        if (this.solid(ch)) {
          if (b.vy > 0 || (b.vy === 0 && prevBottom <= ty * T + 1)) { b.y = ty * T - b.h; b.onGround = true; } else { b.y = (ty + 1) * T; b.hitHead = true; }
          b.vy = 0; ty0 = Math.floor(b.y / T); ty1 = Math.floor((b.y + b.h - .001) / T);
        } else if ((ch === '=' || ch === 'c') && b.vy >= 0 && !(b.dropT > 0) && !o.ghost) {
          const top = ty * T;
          if (prevBottom <= top + .01 + (b.vy * dt > 4 ? 0 : 0) && b.y + b.h > top) {
            if (ch === 'c' && G.crumble) G.crumble(tx, ty);
            b.y = top - b.h; b.vy = 0; b.onGround = true; ty0 = Math.floor(b.y / T); ty1 = Math.floor((b.y + b.h - .001) / T);
          }
        }
      }
      if (!b.onGround && b.vy >= 0) { // probe 1px below for resting contact
        const py = b.y + b.h + .5, ty = Math.floor(py / T);
        for (let tx = Math.floor(b.x / T); tx <= Math.floor((b.x + b.w - .001) / T); tx++) {
          const ch = G.tile(tx, ty);
          if (this.solid(ch) || ((ch === '=' || ch === 'c') && !(b.dropT > 0) && Math.abs(b.y + b.h - ty * T) < 1.2)) { if (b.y + b.h <= ty * T + 1) b.onGround = true; }
        }
      }
    },
    // does the rect overlap any tile satisfying fn(ch)?
    anyTile(G, x, y, w, h, fn) {
      for (let ty = Math.floor(y / T); ty <= Math.floor((y + h - .001) / T); ty++) for (let tx = Math.floor(x / T); tx <= Math.floor((x + w - .001) / T); tx++) { const c = G.tile(tx, ty); if (fn(c, tx, ty)) return true; }
      return false;
    }
  };

  /* ============================== PLAYER ============================== */
  const P = LF.Player = function (G) {
    Object.assign(this, { x: 0, y: 0, w: 10, h: 14, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jumpBuf: 0, airJumps: 1, dashT: 0, dashCD: 0, dashed: false,
      atkT: 0, atkCD: 0, atkDir: 'f', hitSet: null, invul: 0, hurtT: 0, flash: 0, dead: false, gliding: false, wingT: 0, healT: 0, dropT: 0, inWater: false,
      stepT: 0, trail: [], safe: { x: 0, y: 0 }, abil: G.save.abil, wasGround: false, hitCount: 0, lastVy: 0, pogoT: 0 });
  };
  P.prototype = {
    get cx() { return this.x + this.w / 2; }, get cy() { return this.y + this.h / 2; },
    hasCharm(id) { return this.G.save.eq.indexOf(id) >= 0; },
    teleport(x, y) { this.x = x; this.y = y; this.vx = this.vy = 0; this.safe = { x, y }; this.trail.length = 0; },
    dmg() { return 1 + this.G.save.dmgLvl + (this.hasCharm('might') ? 1 : 0); },
    update(G, dt) {
      this.G = G;
      const S = this, ab = G.save.abil;
      S.invul = Math.max(0, S.invul - dt); S.hurtT = Math.max(0, S.hurtT - dt); S.flash = Math.max(0, S.flash - dt);
      S.atkCD = Math.max(0, S.atkCD - dt); S.dashCD = Math.max(0, S.dashCD - dt); S.wingT = Math.max(0, S.wingT - dt); S.dropT = Math.max(0, S.dropT - dt);
      S.coyote = Math.max(0, S.coyote - dt); S.jumpBuf = Math.max(0, S.jumpBuf - dt); S.pogoT = Math.max(0, S.pogoT - dt);
      if (S.atkT > 0) { S.atkT -= dt; if (S.atkT <= 0) S.hitSet = null; }
      const swift = S.hasCharm('swift') ? 1.13 : 1, maxV = 96 * swift;
      const axis = S.hurtT > 0 ? 0 : In.axis;
      // ----- water -----
      const wasW = S.inWater; S.inWater = Phys.anyTile(G, S.x + 2, S.y + 6, S.w - 4, S.h - 8, c => c === 'w');
      if (S.inWater !== wasW) { G.sfx('splash'); G.burst(S.cx, S.y + S.h, 10, '#9af0d8', 60, 1); if (S.inWater) S.vy *= .35; }
      // ----- dash -----
      if (S.hurtT <= 0 && ab.dash && In.hit('dash') && S.dashCD <= 0 && !S.dashed && S.dashT <= 0) {
        S.dashT = .17; S.dashCD = .5; S.dashed = !S.onGround; S.vx = S.face * 255; S.vy = 0; S.invul = Math.max(S.invul, .22); G.sfx('dash'); G.burst(S.cx, S.cy, 8, '#ffd27a', 70, 1);
      }
      if (S.dashT > 0) {
        S.dashT -= dt; S.vy = 0; S.vx = S.face * 255; S.trail.push({ x: S.x, y: S.y, t: .2 });
        const ax = S.face > 0 ? S.x + S.w : S.x - 2; // break dash-cracks
        Phys.anyTile(G, ax, S.y + 2, 2, S.h - 4, (c, tx, ty) => { if (c === 'D') { G.breakTile(tx, ty); } return false; });
        if (S.hitX) S.dashT = 0;
      } else {
        // ----- horizontal -----
        const acc = S.onGround ? 1500 : 1000, fr = S.onGround ? 1700 : 500, wm = S.inWater ? .65 : 1;
        if (axis) { S.face = axis; S.vx = LF.approach(S.vx, axis * maxV * wm, acc * dt * (Math.sign(S.vx) === -axis ? 1.6 : 1)); }
        else S.vx = LF.approach(S.vx, 0, fr * dt);
        // ----- jump -----
        if (S.hurtT <= 0 && In.hit('jump')) {
          if (In.isDown('down') && S.onGround && Phys.anyTile(G, S.x, S.y + S.h + 1, S.w, 1, c => c === '=' || c === 'c')) { S.dropT = .2; S.y += 2; S.coyote = 0; }
          else S.jumpBuf = .13;
        }
        if (S.jumpBuf > 0) {
          if (S.coyote > 0 || (S.inWater && S.vy > -50)) { S.vy = S.inWater ? -210 : -340; S.coyote = 0; S.jumpBuf = 0; S.onGround = false; G.sfx('jump'); G.burst(S.cx, S.y + S.h, 4, '#c9b8e8', 40, 1); S.jumping = true; }
          else if (ab.dbl && S.airJumps > 0 && !S.onGround) { S.vy = -300; S.airJumps--; S.jumpBuf = 0; S.wingT = .35; G.sfx('djump'); G.burst(S.cx, S.cy, 10, '#c49bff', 70, 1); S.jumping = true; }
        }
        if (In.released.jump && S.vy < -110 && S.jumping) { S.vy = -110; S.jumping = false; }
        // ----- gravity / glide -----
        S.gliding = false;
        let g = S.inWater ? 420 : 950;
        if (ab.glide && In.isDown('jump') && S.vy > 30 && !S.onGround && !S.inWater && S.hurtT <= 0) { S.gliding = true; S.vy = LF.approach(S.vy, 36, 1400 * dt); if (Math.random() < .25) G.spark(S.cx + LF.rand(-6, 6), S.cy - 2, '#c49bff'); }
        else S.vy = Math.min(S.vy + g * dt, S.inWater ? 80 : 400);

      }
      // trail decay
      for (let i = S.trail.length - 1; i >= 0; i--) { S.trail[i].t -= dt; if (S.trail[i].t <= 0) S.trail.splice(i, 1); }
      // ----- attack -----
      if (S.hurtT <= 0 && In.hit('attack') && S.atkCD <= 0 && S.dashT <= 0) {
        S.atkT = .2; S.atkCD = S.hasCharm('quick') ? .2 : .31; S.hitSet = new Set();
        S.atkDir = In.isDown('up') ? 'u' : (In.isDown('down') && !S.onGround) ? 'd' : 'f';
        G.sfx('attack'); if (S.atkDir === 'f' && axis === 0) S.vx += S.face * 25;
      }
      // ----- spring / hazards -----
      const below = Phys.anyTile(G, S.x + 2, S.y + S.h, S.w - 4, 2, c => c === 'j');
      if (below && S.vy >= 0) { S.vy = -480; S.airJumps = 1; S.dashed = false; G.sfx('spring'); G.springTile(S.cx, S.y + S.h); S.jumping = false; }
      // ----- move -----
      Phys.move(S, dt, G);

        if (!S.wasGround && S.lastVy > 140) { G.sfx('land'); G.burst(S.cx, S.y + S.h, 5, '#b8a8d8', 40, 1); }
        if (Math.abs(S.vx) > 20) { S.stepT -= dt; if (S.stepT <= 0) { S.stepT = .26; G.sfx('step'); } }

  /* ============================== ENEMIES ============================== */
  const ET = {
    slime:   { w: 14, h: 10, hp: 2, em: 2, spd: 26 },
    beetle:  { w: 16, h: 10, hp: 4, em: 4, spd: 38 },
    mothfoe: { w: 12, h: 10, hp: 2, em: 2, fly: 1 },
    bat:     { w: 12, h: 10, hp: 2, em: 3, fly: 1 },
    thorn:   { w: 14, h: 16, hp: 3, em: 3, still: 1 },
    wisp:    { w: 10, h: 10, hp: 2, em: 3, fly: 1, ghost: 1 },
    jelly:   { w: 14, h: 16, hp: 3, em: 4, fly: 1 },
    husk:    { w: 12, h: 16, hp: 5, em: 6, spd: 30 },

  LF.updateEnemy = function (e, dt, G) {
    const pl = G.player, d = e.d, dx = pl.cx - (e.x + e.w / 2), dy = pl.cy - (e.y + e.h / 2), dist = Math.hypot(dx, dy);
    e.flash = Math.max(0, e.flash - dt); e.t += dt;
    if (e.stun > 0) { e.stun -= dt; e.vx = LF.approach(e.vx, 0, 500 * dt); if (!d.fly) e.vy = Math.min(e.vy + 900 * dt, 380); Phys.move(e, dt, G, { ghost: d.ghost }); return; }
    switch (e.type) {
      case 'slime': case 'beetle': case 'husk': {
        const front = Phys.solid(G.tile(Math.floor((e.x + (e.face > 0 ? e.w + 2 : -2)) / T), Math.floor((e.y + e.h / 2) / T)));
        const ledge = e.onGround && !Phys.anyTile(G, e.x + (e.face > 0 ? e.w : -2), e.y + e.h + 2, 2, 2, c => Phys.solid(c) || c === '=' || c === 'c');
        if (e.state === 'lunge') { e.vx = e.face * 150; if (e.t > .38 || front) { e.state = 'idle'; e.t = -.5; } }
        else if (e.state === 'wind') { e.vx = 0; if (e.t > .45) { e.state = 'lunge'; e.t = 0; } }
        else {
          if (front || ledge) { e.face *= -1; }
          e.vx = e.face * d.spd * (e.type === 'beetle' && Math.sin(e.t * 2 + e.ph) > .6 ? 0 : 1);
          if (e.type === 'husk' && e.t > 0 && Math.abs(dy) < 18 && Math.abs(dx) < 75 && Math.sign(dx) === e.face) { e.state = 'wind'; e.t = 0; }
        }
        e.vy = Math.min(e.vy + 900 * dt, 380); Phys.move(e, dt, G); break;
      }
      case 'mothfoe': {
        e.ph += dt; let tx = e.hx + Math.sin(e.t * 1.4 + e.ph) * 26, ty = e.hy + Math.sin(e.t * 2.3) * 12;
        if (dist < 85) { tx = pl.cx - e.w / 2; ty = pl.cy - e.h / 2 - 6; }
        const sp = dist < 85 ? 48 : 30; e.vx = LF.approach(e.vx, cl(tx - e.x, -1, 1) * sp, 200 * dt); e.vy = LF.approach(e.vy, cl(ty - e.y, -1, 1) * sp, 200 * dt);
        if (Math.abs(e.vx) > 2) e.face = LF.sign(e.vx); Phys.move(e, dt, G); break;
      }
      case 'bat': {
        if (e.state === 'hang') { e.vx = e.vy = 0; if (Math.abs(dx) < 46 && dy > 0 && dy < 150) { e.state = 'swoop'; e.t = 0; } }
        else if (e.state === 'swoop') { const a = Math.atan2(dy, dx); e.vx = LF.approach(e.vx, Math.cos(a) * 95, 500 * dt); e.vy = LF.approach(e.vy, Math.sin(a) * 95, 500 * dt); if (e.t > 1.3) { e.state = 'return'; e.t = 0; } }
        else { const a = Math.atan2(e.hy - e.y, e.hx - e.x); e.vx = Math.cos(a) * 60; e.vy = Math.sin(a) * 60; if (Math.hypot(e.hx - e.x, e.hy - e.y) < 3) { e.state = 'hang'; e.x = e.hx; e.y = e.hy; } }
        if (Math.abs(e.vx) > 2) e.face = LF.sign(e.vx); Phys.move(e, dt, G); break;
      }
      case 'thorn': {
        e.face = dx > 0 ? 1 : -1;
        if (e.state === 'fire') { if (e.t > .35) { e.state = 'idle'; e.t = 0; } }
        else if (e.t > 2.2 && dist < 150 && dist > 12) {
          e.state = 'fire'; e.t = 0; const a = Math.atan2(dy - 4, dx), sp = 78;
          G.projectiles.push({ x: e.x + e.w / 2, y: e.y + 2, w: 5, h: 5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 3, dmg: 1, col: '#ff8aa8', glow: '#ff5a8a', grav: 0 }); G.sfx('shoot');
        }
        break;
      }
      case 'wisp': {
        const a = Math.atan2(dy, dx), sp = dist < 110 ? 34 : 0, wob = Math.sin(e.t * 3 + e.ph) * 14;

        if (!sp) { e.vx = Math.sin(e.t + e.ph) * 10; e.vy = Math.cos(e.t * 1.3) * 8; }

      }
      case 'jelly': {
        e.vy = Math.sin(e.t * 1.6 + e.ph) * 22; e.vx = e.face * 14; const front = Phys.solid(G.tile(Math.floor((e.x + (e.face > 0 ? e.w + 2 : -2)) / T), Math.floor((e.y + e.h / 2) / T)));

      }
    }
  };
  // damage an enemy; returns true if killed
  LF.hurtEnemy = function (e, dmg, dir, G) {
    e.hp -= dmg; e.flash = .12; e.stun = e.type === 'husk' ? .05 : .16; e.vx = dir * (e.d.fly ? 120 : 110); if (!e.d.fly && !e.d.still) e.vy = -90; if (e.state === 'wind' || e.state === 'lunge') { e.state = 'idle'; e.t = -.4; }

  };

  /* ============================== PROJECTILES ============================== */
  LF.updateProjectiles = function (G, dt) {
    const pl = G.player;
    for (let i = G.projectiles.length - 1; i >= 0; i--) {
      const p = G.projectiles[i];
      p.life -= dt; p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;

    }
  };
})();

<script>
/* Lanternfall - bosses: Thornmother, Prism Weaver, Drowned Bell, Hollow Warden + telegraphed hazards */
(function () {
  'use strict';
  const LF = window.LF, T = LF.T, Phys = LF.Phys, cl = LF.clamp;
  const R = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const DEF = {
    thorn: { w: 36, h: 40, hp: 22, fly: 0, contact: 1 },
    prism: { w: 26, h: 24, hp: 26, fly: 1, contact: 1 },
    tide: { w: 30, h: 34, hp: 32, fly: 1, contact: 1 },
    warden: { w: 20, h: 34, hp: 46, fly: 0, contact: 2 },
    snowking: { w: 30, h: 40, hp: 44, fly: 0, contact: 1 }
  };
  const ATK = {
    thorn: ['volley', 'roots', 'charge', 'roots', 'volley'],
    prism: ['beams', 'shards', 'rain', 'swoop', 'shards'],
    tide: ['toll', 'drops', 'dive', 'toll', 'drops'],
    warden: ['slash', 'orbs', 'leap', 'slash', 'orbs', 'combo'],
    snowking: ['throw', 'roll', 'blizzard', 'throw', 'roll', 'blizzard']
  };

  /* ---------- hazards (telegraph then strike) ---------- */
  function haz(G, o) { G.hazards.push(Object.assign({ t: 0, delay: .6, life: .35, dmg: 1, col: '#ff5a8a' }, o)); }
  LF.updateHazards = function (G, dt) {
    const pl = G.player;
    for (let i = G.hazards.length - 1; i >= 0; i--) {
      const h = G.hazards[i]; h.t += dt;
      if (h.t >= h.delay && h.t < h.delay + h.life) {
        if (!h.fired) { h.fired = true; if (h.sfx) G.sfx(h.sfx); if (h.shake) G.shake(h.shake); }
        if (pl.invul <= 0 && !pl.dead && LF.overlap(h, pl)) pl.hurt(G, h.dmg, h.x + h.w / 2);
      }
      if (h.t >= h.delay + h.life) G.hazards.splice(i, 1);
    }
  };
  LF.drawHazards = function (g, G, cam, t) {
    for (const h of G.hazards) {
      const x = h.x - cam.x, y = h.y - cam.y, on = h.t >= h.delay;
      if (!on) { g.globalAlpha = .2 + .25 * Math.sin(h.t * 30) ** 2 + h.t / h.delay * .2; g.fillStyle = h.col; g.fillRect(x | 0, (y + h.h - 2) | 0, h.w, 2); g.fillRect(x | 0, y | 0, h.w, h.h); g.globalAlpha = 1; }
      else { const k = 1 - (h.t - h.delay) / h.life; g.globalAlpha = .55 + .4 * k; R(g, h.col, x, y, h.w, h.h); R(g, '#fff', x + h.w / 2 - 1, y, 2, h.h); g.globalAlpha = 1; }
    }
  };

  const fan = (G, x, y, n, spread, sp, aim, col, glow, grav) => {
    const pl = G.player, base = aim === undefined ? Math.atan2(pl.cy - y, pl.cx - x) : aim;
    for (let i = 0; i < n; i++) {
      const a = base + (n === 1 ? 0 : (i / (n - 1) - .5) * spread);
      G.projectiles.push({ x: x - 3, y: y - 3, w: 6, h: 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 4, dmg: 1, col: col || '#ff8aa8', glow: glow || col || '#ff5a8a', grav: grav || 0 });
    }
    G.sfx('shoot');
  };

  const B = LF.Bosses = {
    make(id, tx, ty, G) {
      const d = DEF[id], hp = Math.ceil(d.hp * (1 + .5 * G.save.ng));
      const b = { kind: 'boss', type: id, id, d, w: d.w, h: d.h, x: tx * T + (T - d.w) / 2, y: (ty + 1) * T - d.h, vx: 0, vy: 0, hp, maxHp: hp, face: -1, flash: 0, stun: 0, state: 'wait', t: 0, n: 0,
        ph: Math.random() * 6, phase: 1, em: 60, floorY: (ty + 1) * T, active: false, did: false, key: 'boss:' + id, hx: tx * T, hy: ty * T };
      return b;
    },
    start(b, G) { b.active = true; b.state = 'idle'; b.t = 0; G.bossIntro(b); },
    next(b) { const l = ATK[b.id]; b.state = l[b.n++ % l.length]; b.t = 0; b.did = false; },
    idle(b, ms) { b.state = 'idle'; b.t = -(ms || 0); b.did = false; },
    hurt(b, dmg, dir, G) {
      if (!b.active || b.dead) return false;
      b.hp -= dmg; b.flash = .1; G.sfx('hit'); G.burst(b.x + b.w / 2, b.y + b.h / 2, 8, '#fff2c9', 80, 1);
      if (!b.d.fly && b.state === 'idle') b.vx += dir * 8;
      const r = b.hp / b.maxHp; b.phase = b.id === 'warden' ? (r < .33 ? 3 : r < .66 ? 2 : 1) : (r < .5 ? 2 : 1);
      if (b.hp <= 0) { b.dead = true; G.killBoss(b); return true; }
      return false;
    },
    update(b, dt, G) {
      const pl = G.player; b.flash = Math.max(0, b.flash - dt);
      if (b.dead) return;
      if (!b.active) { if (G.bossTrigger(b)) B.start(b, G); return; }
      b.t += dt; b.ph += dt;
      const dx = pl.cx - (b.x + b.w / 2), dy = pl.cy - (b.y + b.h / 2);
      B['ai_' + b.id](b, dt, G, pl, dx, dy);
      if (!b.d.fly) { b.vy = Math.min(b.vy + 900 * dt, 380); Phys.move(b, dt, G); }
      else { b.x += b.vx * dt; b.y += b.vy * dt; b.x = cl(b.x, T + 2, G.room.w * T - T - b.w - 2); b.y = cl(b.y, T + 2, b.floorY - b.h); }
    },
    fly(b, tx, ty, sp, dt) { b.vx = LF.approach(b.vx, cl(tx - (b.x + b.w / 2), -1, 1) * sp, 260 * dt); b.vy = LF.approach(b.vy, cl(ty - (b.y + b.h / 2), -1, 1) * sp, 260 * dt); },

    /* ---------------- Thornmother ---------------- */
    ai_thorn(b, dt, G, pl, dx) {
      const sp = b.phase > 1 ? 1.35 : 1, cx = b.x + b.w / 2;
      switch (b.state) {
        case 'idle': b.face = dx > 0 ? 1 : -1; b.vx = Math.abs(dx) > 50 ? b.face * 16 * sp : 0; if (b.t > 1.0 / sp) B.next(b); break;
        case 'volley': b.vx = 0; if (!b.did && b.t > .5) { b.did = true; fan(G, cx, b.y + 10, b.phase > 1 ? 7 : 5, 1.1, 90 * sp); } if (b.t > 1.2) B.idle(b); break;
        case 'roots': b.vx = 0; if (!b.did && b.t > .3) { b.did = true; const n = b.phase > 1 ? 5 : 3; for (let i = 0; i < n; i++) { const x = pl.cx + (i - (n - 1) / 2) * 38 + LF.rand(-6, 6); haz(G, { x: x - 8, y: b.floorY - 34, w: 16, h: 34, delay: .7 + i * .16 / sp, life: .4, col: '#ff5a8a', sfx: 'crack', shake: 2 }); } } if (b.t > 2.0) B.idle(b); break;
        case 'charge': b.face = dx > 0 ? 1 : -1; if (b.t < .6) { b.vx = 0; b.x += Math.sin(b.t * 70) * .5; } else if (b.t < 1.25) { b.vx = b.face * 175 * sp; if (b.hitX) { b.state = 'dizzy'; b.t = 0; G.shake(7); G.sfx('boom'); G.burst(b.x + b.w / 2, b.y + 10, 14, '#ff8aa8', 90, 1); } } else B.idle(b, .3); break;
        case 'dizzy': b.vx = 0; if (b.t > 1.2) B.idle(b); break;
      }
    },
    /* ---------------- Prism Weaver ---------------- */
    ai_prism(b, dt, G, pl, dx) {
      const sp = b.phase > 1 ? 1.3 : 1, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      switch (b.state) {
        case 'idle': B.fly(b, pl.cx + Math.sin(b.ph * 1.3) * 70, 52 + Math.sin(b.ph * 2) * 12, 55 * sp, dt); if (b.t > 1.2 / sp) B.next(b); break;

<script>
/* Lanternfall - UI core: DOM screens, navigation, toast/banner/tip, dialog, title, settings, confirm */
(function () {

    },

    /* ---------- dialog ---------- */
    dialog(d, done) {
      const box = h('div'); box.id = 'dialog'; const p = h('div', 'panel'); const who = h('div', 'who', d.who || ''), txt = h('div', 'txt'), nx = h('div', 'nx', '▼');
      p.append(who, txt, nx); box.append(p); this.layer.appendChild(box);

      const type = () => {

        timer = setInterval(() => {
          pos++; txt.textContent = lines[i].slice(0, pos); if (pos % 2 === 0) LF.Audio.talk(lines[i][pos - 1] || 'a', d.who === 'Pip' ? 380 : d.who === 'Marrow' ? 180 : 280);
          if (pos >= lines[i].length) { clearInterval(timer); timer = null; nx.style.visibility = 'visible'; }

        const row = h('div', 'row'), lab = h('label', '', label), inp = h('input'); inp.type = 'range'; inp.min = 0; inp.max = 100; inp.value = Math.round(st[key] * 100);

      this.setNav(items, a => { if (a === 'pause') { bk.click(); return true; } if (a === 'left' || a === 'right') { const b = items[this.nav.sel]; if (b && b.classList.contains('tog')) b.click(); return true; } return false; });
    },

    helpHTML() {
      return '<div class="cols"><div class="col"><h3>Keyboard</h3>' +
        [['Move', 'A / D · ← →'], ['Jump (hold = higher)', 'Space · Z · K'], ['Strike (+ ↑/↓ aim)', 'X · J · Enter'], ['Dash', 'C · Shift · L'], ['Interact / Read / Talk', '↑ · W · E'], ['Kindle (heal)', 'Hold ↓ on ground'], ['Flare (needs gauge)', 'V · F · Q'], ['Pause / Menu', 'Esc · P'], ['Map · Charms', 'M · I / Tab']].map(r => '<div class="stat"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') +
        '</div><div class="col"><h3>Tips</h3><div class="entry">Light <b>shrines</b> to save and heal. Dying drops your embers where you fell; recover them.</div><div class="entry">Strike <b>down</b> in the air to bounce off foes and spikes.</div><div class="entry">Cracked walls break with 3 strikes. <b>Orange</b> cracks need the Dash. Some walls are only illusions.</div><div class="entry">Hits fill your <b>Flare</b> gauge. Spend it to blast nearby foes. Strike an incoming shot to <b>deflect</b> it back; strike just as it arrives for a perfect parry. Chain kills for bonus embers, and watch for <b>elite</b> foes with glowing auras.</div><div class="entry"><b>Seasonal boards:</b> after the Thornmother a storm portal opens in the Glade. Clear it to unlock the snow portal. Both are replayable bonus boards.</div><div class="entry"><b>Install:</b> use your browser menu (Install app, or Add to Home Screen). Lanternfall then plays offline.</div><div class="entry">Moths, heart fragments and charms hide in secret places. Gamepads work too.</div></div></div>';

    killO.call(this, e);
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2, col = e.affix && LF.ELITE[e.affix] ? LF.ELITE[e.affix][1] : '#c8fff0';
    for (let k = 0; k < (e.affix ? 5 : 3); k++) this.particles.push({ x: cx + LF.rand(-4, 4), y: cy + LF.rand(-3, 3), vx: LF.rand(-9, 9), vy: -LF.rand(20, 36), life: 1.3, max: 1.5, col, sz: 1, g: -14, glow: 1 });
  };
  const respawnO = G.respawn; G.respawn = function () { this.phoenixUsed = false; return respawnO.apply(this, arguments); };
  const loadO = G.loadRoom; G.loadRoom = function () { const r = loadO.apply(this, arguments); this.air = 0; this.grazeSet = null; return r; };

  /* ---------- bounties, stats, help ---------- */
  LF.BOUNTIES.push(
    { id: 'graze', name: 'Needle Thread', desc: 'Graze 15 foes or shots by dashing through them.', test: s => [(s.ext || {}).graze || 0, 15], reward: 'embers:130', rtxt: '130 embers' },
    { id: 'air', name: 'Sky Dancer', desc: 'String together an x5 Air Chain.', test: s => [(s.ext || {}).air || 0, 5], reward: 'embers:140', rtxt: '140 embers' }
  );
  const statsO = UI.tab_stats;
  UI.tab_stats = function (body) {
    const r = statsO.apply(this, arguments), s = G.save.ext || {}, col = body.querySelector('.col');
    if (col) col.insertAdjacentHTML('beforeend', [['Grazes', s.graze || 0], ['Best air chain', s.air || 0], ['Best kill chain', s.chain || 0], ['Perfect and normal deflects', s.parries || 0]].map(x => '<div class="stat"><span>' + x[0] + '</span><b>' + x[1] + '</b></div>').join(''));
    return r;
  };
  const helpO = UI.helpHTML;
  UI.helpHTML = function () {
    const h = helpO.apply(this, arguments), tip = '<div class="entry"><b>Graze:</b> dash through a foe or a shot to feed the Flare and earn an ember. <b>Air Chain:</b> keep pogoing off foes without landing for bonus Flare and embers.</div>';
    const i = h.lastIndexOf('</div></div>');
    return i < 0 ? h : h.slice(0, i) + tip + h.slice(i);
  };
})();

</script>
<script>
/* Lanternfall - boot, fixed-timestep loop, scaling, error handling */
(function () {
  'use strict';
  const LF = window.LF, G = LF.G, In = LF.input;
  LF.state = 'boot';
  const cv = document.getElementById('game'), g = cv.getContext('2d'), stage = document.getElementById('stage');
  g.imageSmoothingEnabled = false;

  /* ---------- scaling: keep 16:9, scale the 960x540 stage to fit ---------- */
  const rot = document.createElement('div');
  rot.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:6px;text-align:center;background:#241c46;color:#ffd27a;font:700 13px sans-serif;letter-spacing:.1em;z-index:200;display:none';
  rot.textContent = 'Rotate your device for the best view';
  document.body.appendChild(rot);
  // Display canvas: the 320x180 game canvas is upscaled by a whole-number factor (crisp, even pixels),
  // then the browser smooths the remaining fractional scale. This removes pixel shimmer while scrolling.
  const view = document.createElement('canvas'), vg = view.getContext('2d');
  view.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto';
  stage.insertBefore(view, cv); cv.style.display = 'none';
  let vk = 0;
  function sizeView(s) {
    const k = Math.max(2, Math.min(6, Math.ceil(3 * s * (window.devicePixelRatio || 1) - .001)));
    if (k !== vk) { vk = k; view.width = 320 * k; view.height = 180 * k; vg.imageSmoothingEnabled = false; }
  }
  function resize() {
    const s = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    sizeView(s);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    document.documentElement.style.setProperty('--u', '18px');
    rot.style.display = (window.innerHeight > window.innerWidth * 1.15 && LF.touchDetected) ? 'block' : 'none';
  }
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize); resize();

  /* ---------- error handling ---------- */
  let errs = 0;
  function fatal(e) {
    console.error(e); errs++;
    if (errs === 3) {
      const d = document.createElement('div'); d.className = 'screen dim'; d.style.zIndex = 90;
      d.innerHTML = '<div class="panel" style="text-align:center"><h2>Something flickered</h2><p>The game hit an unexpected error. Your last save is safe.</p></div>';
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Reload'; b.onclick = () => location.reload(); d.firstChild.appendChild(b); stage.appendChild(d);
    }
  }
  window.addEventListener('error', e => fatal(e.error || e.message));

  /* ---------- boot ---------- */
  LF.loadSettings(); LF.initTouch(); LF.UI.init();
  const unlock = () => { LF.Audio.init(); };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (document.hidden && LF.state === 'play') LF.UI.menu('pause'); });
  window.addEventListener('blur', () => { if (LF.state === 'play') LF.UI.menu('pause'); });
  // autosave periodically while playing
  setInterval(() => { if (G.save && LF.state === 'play' && G.save.flags.started) LF.Save.write(G.save); }, 30000);
  window.addEventListener('beforeunload', () => { if (G.save && G.save.flags.started) LF.Save.write(G.save); });

  G.fade.a = 1; G.fadeTo(0, 1.5);
  LF.UI.title();

  /* ---------- loop ---------- */
  const STEP = 1 / 60; let last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    try {
      acc += Math.min(0.1, (now - last) / 1000); last = now;
      LF.pollPad();
      let n = 0;
      while (acc >= STEP && n < 5) {
        // keep presses made during hit-stop alive until the simulation actually runs again
        const frozen = LF.state === 'play' && G.hitstopT > 0;
        G.update(STEP); if (!frozen) In.endFrame(); acc -= STEP; n++;
      }
      if (n === 5) acc = 0;
      LF.alpha = acc / STEP;
      if (LF.state === 'title' || !G.room) G.renderTitle(g, G.clock); else G.render(g);
      vg.drawImage(cv, 0, 0, view.width, view.height);
    } catch (e) { fatal(e); }
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();

</script>
